[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimetrix"
version = "0.1.0"
description = "Open-source tools for optical metrology analysis (slanted-edge MTF and more)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdullah Alshuaibi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
